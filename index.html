<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Alunos</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <h1>Cadastro de Alunos</h1>

  <form id="formAluno">
    <label for="nome">Nome:</label>
    <input id="nome" name="nome" type="text" placeholder="Digite o nome" required>

    <label for="nota">Nota:</label>
    <input id="nota" name="nota" type="number" min="0" max="10" step="0.1" placeholder="Digite a nota" required>

    <button type="submit">Salvar</button>
  </form>

  <p id="mensagem">Ainda não recebi os dados.</p>

  <script src="script.js"></script>
</body>
</html>
